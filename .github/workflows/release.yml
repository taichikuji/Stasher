name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency: chrome-web-store-release
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test

      - name: Set version
        id: version
        run: |
          VERSION=$(jq -er '.version | select(type == "string")' manifest.json)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match manifest version v$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Chromium ZIP
        run: |
          zip -r "Stasher_${{ steps.version.outputs.VERSION }}.chromium.zip" \
            manifest.json \
            src \
            assets/icon_16.png \
            assets/icon_32.png \
            assets/icon_48.png \
            assets/icon_128.png

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Stasher_${{ steps.version.outputs.VERSION }}.chromium.zip
          generate_release_notes: true

      - name: Authenticate to Chrome Web Store
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit to Chrome Web Store
        uses: hamzahamidi/publish-to-chrome-web-store@v1.2.2
        with:
          access-token: ${{ steps.google-auth.outputs.access_token }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: feepkkcjmhhlmbghklpakdijphnlfjok
          zip: Stasher_${{ steps.version.outputs.VERSION }}.chromium.zip
